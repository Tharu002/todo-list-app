<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Todo List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #4a00e0 0%, #8e2de2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .date-display {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-top: 10px;
        }

        /* Input Section */
        .input-section {
            padding: 25px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        #taskInput {
            flex: 1;
            padding: 15px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        #taskInput:focus {
            outline: none;
            border-color: #4a00e0;
            box-shadow: 0 0 0 3px rgba(74, 0, 224, 0.1);
        }

        .priority-select {
            padding: 0 15px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            background: white;
            font-size: 16px;
            cursor: pointer;
        }

        .add-btn {
            background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
        }

        /* Stats */
        .stats {
            display: flex;
            justify-content: space-between;
            padding: 15px 25px;
            background: #f8f9fa;
            color: #666;
            font-size: 0.9rem;
            border-bottom: 2px solid #e9ecef;
        }

        /* Filters */
        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px 25px;
            background: #f8f9fa;
        }

        .filter-btn {
            padding: 8px 20px;
            border: 2px solid #dee2e6;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .filter-btn.active {
            background: #4a00e0;
            color: white;
            border-color: #4a00e0;
        }

        /* Task List */
        .task-list {
            max-height: 400px;
            overflow-y: auto;
            padding: 20px;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 5px solid #4a00e0;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-item.high { border-left-color: #ff4757; }
        .task-item.medium { border-left-color: #ffa502; }
        .task-item.low { border-left-color: #2ed573; }

        .task-checkbox {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            cursor: pointer;
        }

        .task-content {
            flex: 1;
            margin-right: 15px;
        }

        .task-text {
            font-size: 16px;
            word-break: break-word;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #888;
        }

        .task-priority {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 15px;
            margin-top: 5px;
            display: inline-block;
            font-weight: bold;
        }

        .priority-high { background: #ff4757; color: white; }
        .priority-medium { background: #ffa502; color: white; }
        .priority-low { background: #2ed573; color: white; }

        .task-actions {
            display: flex;
            gap: 10px;
        }

        .edit-btn, .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .edit-btn {
            color: #3742fa;
        }

        .edit-btn:hover {
            background: rgba(55, 66, 250, 0.1);
        }

        .delete-btn {
            color: #ff4757;
        }

        .delete-btn:hover {
            background: rgba(255, 71, 87, 0.1);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .empty-state i {
            font-size: 60px;
            margin-bottom: 20px;
            color: #dee2e6;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
            border-top: 2px solid #e9ecef;
        }

        /* Edit Input */
        .edit-input {
            width: 100%;
            padding: 8px;
            border: 2px solid #4a00e0;
            border-radius: 5px;
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                border-radius: 10px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
                flex-direction: column;
                gap: 10px;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .task-actions {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header with Date -->
        <div class="header">
            <h1><i class="fas fa-tasks"></i> Smart Todo List</h1>
            <div class="date-display" id="currentDate">Loading date...</div>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="What do you need to do today?">
                <select class="priority-select" id="prioritySelect">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
                <button class="add-btn" id="addBtn">
                    <i class="fas fa-plus"></i> Add Task
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div>Total: <span id="totalTasks">0</span> tasks</div>
            <div>Active: <span id="activeTasks">0</span> tasks</div>
            <div>Completed: <span id="completedTasks">0</span> tasks</div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All Tasks</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <!-- Task List -->
        <div class="task-list" id="taskList">
            <!-- Tasks will be added here by JavaScript -->
            <div class="empty-state" id="emptyState">
                <i class="fas fa-clipboard-list"></i>
                <h3>No tasks yet</h3>
                <p>Add your first task above to get started!</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>📝 Tasks are saved automatically | Built with ❤️ | Your First GitHub Project</p>
        </div>
    </div>

    <script>
        // DOM Elements
        const taskInput = document.getElementById('taskInput');
        const prioritySelect = document.getElementById('prioritySelect');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');
        const totalTasksEl = document.getElementById('totalTasks');
        const activeTasksEl = document.getElementById('activeTasks');
        const completedTasksEl = document.getElementById('completedTasks');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const currentDateEl = document.getElementById('currentDate');

        // Initialize
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let currentFilter = 'all';
        let editingTaskId = null;

        // Set current date
        function updateCurrentDate() {
            const now = new Date();
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            currentDateEl.textContent = now.toLocaleDateString('en-US', options);
        }

        // Update statistics
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(task => task.completed).length;
            const active = total - completed;

            totalTasksEl.textContent = total;
            activeTasksEl.textContent = active;
            completedTasksEl.textContent = completed;
        }

        // Save tasks to localStorage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            updateStats();
        }

        // Add new task
        function addTask() {
            const text = taskInput.value.trim();
            if (text === '') {
                alert('Please enter a task!');
                return;
            }

            const newTask = {
                id: Date.now(),
                text: text,
                priority: prioritySelect.value,
                completed: false,
                createdAt: new Date().toISOString()
            };

            tasks.push(newTask);
            saveTasks();
            renderTasks();
            
            // Reset input
            taskInput.value = '';
            taskInput.focus();
            prioritySelect.value = 'medium';
        }

        // Toggle task completion
        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    return { ...task, completed: !task.completed };
                }
                return task;
            });
            saveTasks();
            renderTasks();
        }

        // Delete task
        function deleteTask(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;
            
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
            renderTasks();
        }

        // Start editing task
        function startEditTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            editingTaskId = id;
            renderTasks();
        }

        // Save edited task
        function saveEditTask(id, newText) {
            if (!newText.trim()) {
                alert('Task cannot be empty!');
                return;
            }

            tasks = tasks.map(task => {
                if (task.id === id) {
                    return { ...task, text: newText.trim() };
                }
                return task;
            });

            editingTaskId = null;
            saveTasks();
            renderTasks();
        }

        // Cancel editing
        function cancelEdit() {
            editingTaskId = null;
            renderTasks();
        }

        // Filter tasks
        function filterTasks() {
            let filteredTasks = [...tasks];

            if (currentFilter === 'active') {
                filteredTasks = tasks.filter(task => !task.completed);
            } else if (currentFilter === 'completed') {
                filteredTasks = tasks.filter(task => task.completed);
            }

            return filteredTasks;
        }

        // Render tasks
        function renderTasks() {
            const filteredTasks = filterTasks();
            
            if (filteredTasks.length === 0) {
                emptyState.style.display = 'block';
                taskList.innerHTML = '';
                taskList.appendChild(emptyState);
                return;
            }

            emptyState.style.display = 'none';
            taskList.innerHTML = '';

            filteredTasks.forEach(task => {
                const taskElement = document.createElement('div');
                taskElement.className = `task-item ${task.priority}`;
                
                if (editingTaskId === task.id) {
                    // Edit mode
                    taskElement.innerHTML = `
                        <input type="text" 
                               class="edit-input" 
                               value="${task.text}"
                               id="editInput-${task.id}"
                               autofocus>
                        <div class="task-actions">
                            <button class="edit-btn" onclick="saveEditTask(${task.id}, document.getElementById('editInput-${task.id}').value)">
                                <i class="fas fa-check"></i>
                            </button>
                            <button class="delete-btn" onclick="cancelEdit()">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    `;
                } else {
                    // Display mode
                    const priorityText = task.priority.charAt(0).toUpperCase() + task.priority.slice(1);
                    
                    taskElement.innerHTML = `
                        <input type="checkbox" 
                               class="task-checkbox" 
                               ${task.completed ? 'checked' : ''}
                               onchange="toggleTask(${task.id})">
                        <div class="task-content">
                            <div class="task-text ${task.completed ? 'completed' : ''}">
                                ${task.text}
                            </div>
                            <span class="task-priority priority-${task.priority}">
                                ${priorityText} Priority
                            </span>
                        </div>
                        <div class="task-actions">
                            <button class="edit-btn" onclick="startEditTask(${task.id})" ${task.completed ? 'disabled style="opacity:0.5"' : ''}>
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="delete-btn" onclick="deleteTask(${task.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;
                }

                taskList.appendChild(taskElement);
            });
        }

        // Event Listeners
        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // Filter buttons
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderTasks();
            });
        });

        // Initialize app
        function init() {
            updateCurrentDate();
            updateStats();
            renderTasks();
        }

        // Start the app
        init();
    </script>
</body>
</html>
